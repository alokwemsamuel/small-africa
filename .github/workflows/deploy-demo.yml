# Builds the demo (whole site + admin running in the browser, no server) and publishes it to
# GitHub Pages: https://alokwemsamuel.github.io/small-africa/  (see docs/DEMO.md)
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The real site must never contain demo code (the in-browser API, its data, simulated sign-in).
      - run: npm run build
      - run: npm run check:prod-bundle
      # Pre-builds the public pages as HTML from the demo data and writes 404.html (the app shell).
      - run: npm run build:demo
      # Phones from 320px to 430px, dark and light: no page may be wider than the screen
      # (a too-wide page makes Chrome on Android zoom everything out). A failure stops the deploy.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
