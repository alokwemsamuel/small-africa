<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Small Africa · Nigerian, Polish & Continental Fine Dining in Lagos</title>
    <meta
      name="description"
      content="Small Africa is a fine-dining restaurant and lounge in Victoria Island, Lagos, serving Nigerian, Polish and Continental cuisine. Three kitchens. One table."
    />
    <meta name="theme-color" content="#0E0C0A" />
    <meta name="color-scheme" content="dark light" />
    <!-- Applies the saved appearance before first paint. External file, so no unsafe-inline in CSP. -->
    <script src="%BASE_URL%theme-init.js"></script>
    <!-- First-screen fonts (Latin), so headings don't reflow when they arrive. Vite rewrites these
         paths to the same hashed files the stylesheet uses. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/italiana/files/italiana-latin-400-normal.woff2"
    />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:site_name" content="Small Africa" />
    <meta property="og:title" content="Small Africa · Three kitchens. One table." />
    <meta property="og:description" content="Nigerian, Polish and Continental fine dining in Lagos." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Structured data (a non-executable data block, so it is allowed under the CSP). Contact details are placeholders until launch. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Small Africa",
        "description": "Fine-dining restaurant and lounge serving Nigerian, Polish and Continental cuisine. Three kitchens. One table.",
        "servesCuisine": ["Nigerian", "Polish", "Continental", "African", "European"],
        "priceRange": "₦₦₦₦",
        "currenciesAccepted": "NGN",
        "paymentAccepted": "Cash, Credit Card, Bank Transfer",
        "acceptsReservations": "True",
        "telephone": "+234 700 000 0000",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Victoria Island",
          "addressRegion": "Lagos",
          "addressCountry": "NG"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "12:00",
            "closes": "23:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday"],
            "opens": "12:00",
            "closes": "23:59"
          },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "13:00", "closes": "22:00" }
        ],
        "url": "%VITE_SITE_URL%/",
        "menu": "%VITE_SITE_URL%/menu",
        "image": "%VITE_SITE_URL%/og-image.png",
        "logo": "%VITE_SITE_URL%/favicon-512.png"
      }
    </script>
  </head>
  <body>
    <noscript
      >Small Africa needs JavaScript enabled to take orders and reservations. Call us on +234 700 000
      0000.</noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
